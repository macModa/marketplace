server.port=8080

# ==========================================================
# DATABASE — Variables injectées depuis .env ou session
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/marketplace_local?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:marketplace_dev}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

# ==========================================================
# SECURITY (JWT)
# ==========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================================================
# CORS
# ==========================================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# ==========================================================
# LOGGING
# ==========================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR
logging.level.com.marketplace.security=DEBUG
logging.level.com.marketplace.service=DEBUG

server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-binding-errors=always

# ==========================================================
# ACTUATOR
# ==========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================================
# CLOUDINARY
# ==========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================================
# FIREBASE FCM
# ==========================================================
fcm.project-id=${FCM_PROJECT_ID:marchi-79740}
fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:marchi-79740-firebase-adminsdk-fbsvc-cd6a7f211f.json}
fcm.api-base-url=https://fcm.googleapis.com/v1/projects/${FCM_PROJECT_ID:marchi-79740}/messages:send
fcm.token-scope=https://www.googleapis.com/auth/firebase.messaging
fcm.default-ttl-seconds=3600
fcm.click-action=FLUTTER_NOTIFICATION_CLICK
fcm.retry.max-attempts=3
fcm.retry.initial-backoff-ms=500
fcm.retry.multiplier=2.0
