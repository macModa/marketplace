spring:
  application:
    name: marketplace-backend

  datasource:
    url: jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&serverTimezone=UTC
    username: jesselee
    password: 53945422Jasser
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    user:
      name: admin
      password: admin

jwt:
  secret: mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForProductionUse
  expiration: 86400000

logging:
  level:
    root: INFO
    com.marketplace: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/marketplace.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
