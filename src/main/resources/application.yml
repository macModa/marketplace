spring:
  application:
    name: marketplace-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/marketplace_local?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:marketplace_dev}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    user:
      name: admin
      password: ${SECURITY_USER_PASSWORD:disabled}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.marketplace: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/marketplace.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
