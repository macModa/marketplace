  expiration: 86400000

cloudinary:
  cloud-name: dummy-test-cloud
  api-key: "123456789012345"
  api-secret: dummy-secret-test-key-market

fcm:
  project-id: dummy-fcm-project
  service-account-path: dummy-fcm-service-account.json
