name: Java CI with Maven

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit & Integration Tests (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run tests with Maven Wrapper
        run: ./mvnw clean test --no-transfer-progress

      - name: Upload JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-junit-reports
          path: |
            target/surefire-reports/TEST-*.xml
            target/surefire-reports/*.txt
          if-no-files-found: warn
          retention-days: 7

  quality-guardian-api:
    name: Quality Guardian API Tests (Python 3.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install API dependencies
        run: python -m pip install -r ai-lab/month-01-quality-guardian/api/requirements.txt

      - name: Run API tests
        run: python -m pytest ai-lab/month-01-quality-guardian/api/tests/test_api.py -v
